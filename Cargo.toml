[package]
name = "mini-kv-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local Rust key-value store with a checksummed write-ahead log"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
